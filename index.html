<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Socket.IO UNA</title>
    <style nonce="__CSP_NONCE__">
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { display: flex; gap: 4px; background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; min-width: 64px; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #nombre, #m { display: inline-block;}
      #m { flex: 1; min-width: 0; }
      #nombre { width: 20%; min-width: 0; }
      #messages li { overflow-wrap: anywhere; white-space: pre-wrap; }
      #messages img, #messages video { display: block; max-width: 100%; max-height: 400px; margin-top: 8px; }
      #messages iframe { display: block; width: 560px; max-width: 100%; height: 315px; border: 0; margin-top: 8px; }
      #chat-error { position: fixed; bottom: 44px; left: 0; right: 0; padding: 10px; background: #fff0f0; color: #9b1c1c; border-top: 1px solid #9b1c1c; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <p id="chat-error" role="alert" hidden></p>
    <form action="">
      <input id="nombre" autocomplete="off" maxlength="60" placeholder="Username" aria-label="Nombre"/>
      <input id="m" autocomplete="off" maxlength="4000" placeholder="Escriba un mensaje o pegue una URL" aria-label="Mensaje o URL" /><button>Send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script nonce="__CSP_NONCE__">

    var colorHexTxt = "";

    // genera colores aleatorios en hexadeximal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }

        return color;
     }

      document.addEventListener('DOMContentLoaded', function () {
        var socket = io();
        var input = document.getElementById('m');
        var errorMessage = document.getElementById('chat-error');
        socket.on('Error-Mensaje', function (error) {
          errorMessage.textContent = error;
          errorMessage.hidden = false;
        });

        // emite evento al servidor
        
        document.querySelector('form').addEventListener('submit', function(event){
            event.preventDefault();
            errorMessage.hidden = true;
            var nombreTxt = document.getElementById('nombre').value || "Anonimo";
            var mensajeTxt = input.value;
            if (!mensajeTxt.trim()) return;

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            input.value = '';
        });

        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);
            var item = document.createElement('li');
            var name = document.createElement('b');
            name.textContent = msgJson.nombre;
            name.style.color = msgJson.color;
            item.append(name, document.createTextNode(': '));

            var media = msgJson.media;
            if (media) {
              // El servidor valida las URLs. Nunca insertar HTML del usuario.
              var element;
              if (media.tipo === 'imagen') {
                element = document.createElement('img');
                element.alt = 'Imagen compartida';
              } else if (media.tipo === 'video') {
                element = document.createElement('video');
                element.controls = true;
                element.preload = 'metadata';
                element.textContent = 'Su navegador no puede reproducir este video. Abra el enlace.';
              } else if (media.tipo === 'youtube') {
                element = document.createElement('iframe');
                element.title = 'Video de YouTube compartido';
                element.allow = 'encrypted-media; picture-in-picture; fullscreen';
                element.allowFullscreen = true;
              }
              if (element) {
                element.src = media.url;
                element.addEventListener('load', function () {
                  window.scrollTo(0, document.body.scrollHeight);
                });
                element.addEventListener('error', function () {
                  element.remove();
                  var link = document.createElement('a');
                  link.href = media.url;
                  link.textContent = 'Abrir contenido';
                  link.target = '_blank';
                  link.rel = 'noopener noreferrer';
                  item.append(document.createTextNode(' No se pudo cargar el contenido. '), link);
                });
                item.append(element);
              }
            } else {
              item.append(document.createTextNode(msgJson.mensaje));
            }
            document.getElementById('messages').append(item);
            window.scrollTo(0, document.body.scrollHeight);
        });

      });
    </script>
  </body>
</html>
